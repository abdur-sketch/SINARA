services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sinur
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: sinur_hrm_dev
    ports:
      - "5434:5432"
    volumes:
      - sinur_hrm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sinur -d sinur_hrm_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sinur_hrm_pgdata:
